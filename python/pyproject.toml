[project]
name = "ai-fraud-detection"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"


dependencies = [
    "polars[pandas, numpy, pyarrow]",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "PyQt6",
    "numpy",
    "imbalanced-learn",
    "lightgbm==4.6.0",
    "torch>=2.7.0",
    "pytorch-tabnet",
    "catboost",
    "xgboost",
    "optuna",
    "plotly",
    "kaleido==0.1.0.post1",
    "nbformat",
    "ipython",
    "python-dotenv",
    "onnxmltools",
    "onnxruntime"
]

[tool.uv.sources]
onnxmltools = { git = "https://github.com/onnx/onnxmltools" }
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
lint = [
    "ruff"
]

[tool.uv]
default-groups = ["lint"]
